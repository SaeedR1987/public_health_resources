# Run shinytest2 UI tests in CI (headless browser)
name: "Shiny: shinytest2 CI"

on:
  workflow_dispatch: {}         # manual trigger

jobs:
  shiny-ui-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'

      - name: Install system dependencies (Chromium)
        run: |
          sudo apt-get update
          # Common headless chrome deps; adjust as needed
          sudo apt-get install -y chromium-browser xvfb libgtk-3-0 libnss3

      - name: Install R dependencies
        run: |
          Rscript -e 'install.packages("remotes", repos = "https://cloud.r-project.org")'
          Rscript -e 'remotes::install_deps(dependencies = TRUE)'
          Rscript -e 'if (!requireNamespace("shinytest2", quietly = TRUE)) install.packages("shinytest2")'

      - name: Run shinytest2 tests
        env:
          # If your tests rely on environment variables, set dev-safe placeholders here or add them to repo secrets
          R_CONFIG_ACTIVE: default
        run: |
          # Run shinytest2 tests. Adjust path if your tests are located elsewhere.
          Rscript -e 'shinytest2::test_app(app_dir = ".", shiny_args = list(host = "127.0.0.1"), reporter = "summary")'
