# Run package unit tests on push and pull_request
name: "R: run tests"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        r: [ '4.2', '4.3', '4.4' ]  # adjust as needed

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}

      - name: Install system dependencies and pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install R package dependencies
        run: |
          Rscript -e 'install.packages("remotes", repos = "https://cloud.r-project.org")'
          Rscript -e 'remotes::install_deps(dependencies = TRUE)'

      - name: Run tests with testthat
        run: |
          Rscript -e 'if (!requireNamespace("testthat", quietly = TRUE)) install.packages("testthat")'
          Rscript -e 'testthat::test_dir("tests/testthat", reporter = "summary")'
