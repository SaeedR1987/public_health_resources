# Manual / gated deploy to shinyapps.io (staging). Use workflow_dispatch or push to a protected branch.
name: "Deploy: shinyapps.io (staging)"

on:
  workflow_dispatch: {}         # manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop-ui_server' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'

      - name: Install rsconnect
        run: |
          Rscript -e 'install.packages("rsconnect", repos = "https://cloud.r-project.org")'

      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }} # optional
        run: |
          Rscript -e '
            token <- Sys.getenv("SHINYAPPS_TOKEN");
            secret <- Sys.getenv("SHINYAPPS_SECRET");
            account <- Sys.getenv("SHINYAPPS_ACCOUNT");
            if (token == "" || secret == "") stop("Missing shinyapps credentials in secrets");
            if (account != "") rsconnect::setAccountInfo(name = account, token = token, secret = secret) ;
            rsconnect::deployApp(appDir = ".", appName = "iphRa-staging", forceUpdate = TRUE)
          '
